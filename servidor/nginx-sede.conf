# /etc/nginx/sites-available/sede  (Certbot agrega las líneas del certificado al instalarlo)
# Asistente (el congo): como mucho 10 preguntas por minuto por dirección; asistente.py pone además topes por hora y por día
limit_req_zone $binary_remote_addr zone=asistente:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name sedecaribe.ucr.ac.cr;
    root /var/www/sede;
    index index.html;
    server_tokens off;
    charset utf-8;

    include /etc/nginx/snippets/sede-cabeceras.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/calendar application/rss+xml;

    location /assets/ { expires 30d; add_header Cache-Control "public"; include /etc/nginx/snippets/sede-cabeceras.conf; }
    location /media/  { expires 30d; add_header Cache-Control "public"; include /etc/nginx/snippets/sede-cabeceras.conf; }
    location ~ \.(html|xml|ics|json)$ { add_header Cache-Control "no-cache"; include /etc/nginx/snippets/sede-cabeceras.conf; }
    location = /agenda.ics { default_type text/calendar; add_header Cache-Control "no-cache"; include /etc/nginx/snippets/sede-cabeceras.conf; }

    # Direcciones del sitio anterior (Joomla) que se siguen compartiendo
    location ~ ^/index\.php/docencia/carreras  { return 301 /estudiar.html; }
    location ~ ^/index\.php/sede-caribe/noticias { return 301 /noticias.html; }
    location ~ ^/index\.php/sede-caribe/contactos { return 301 /directorio.html; }
    location ~ ^/index\.php/sede-caribe/        { return 301 /la-sede.html; }
    location ~ ^/index\.php/vida-estudiantil/unidad-de-vida-estudiantil { return 301 /unidades/vida-estudiantil.html; }
    location ~ ^/index\.php/vida-estudiantil/(gimnasio|piscina|residencias) { return 301 /unidades/$1.html; }
    location ~ ^/index\.php/investigacion/biblioteca { return 301 /unidades/biblioteca.html; }
    location ~ ^/index\.php/investigacion/       { return 301 /unidades/investigacion.html; }
    location ~ ^/index\.php/accion-social/cius   { return 301 /unidades/ciub.html; }
    location ~ ^/index\.php/accion-social/educacion-continua { return 301 /unidades/educacion-continua.html; }
    location ~ ^/index\.php/accion-social/       { return 301 /unidades/accion-social.html; }
    location ~ ^/index\.php/administracion/      { return 301 /unidades/administracion.html; }
    location ~ ^/index\.php/docencia/lab         { return 301 /unidades/laboratorios.html; }
    location ~ ^/index\.php/docencia/            { return 301 /unidades/docencia.html; }
    location ~ ^/index\.php/enlaces-para-        { return 301 /enlaces.html; }
    location ~ ^/index\.php/otros-enlaces        { return 301 /enlaces.html; }
    location = /index.php { return 301 /; }

    # Asistente: lo atiende servidor/asistente.py (sede-asistente.service); la respuesta llega por partes
    location /api/asistente {
        limit_req zone=asistente burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 90s;
        include /etc/nginx/snippets/sede-cabeceras.conf;
    }

    location / { try_files $uri $uri/ =404; }
    error_page 404 /404.html;
    location ~ /\. { deny all; }
}
